<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CCSArchive: flashcards, spaced repetition and quizzes that run entirely in your browser.">
  <title>CCSArchive</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script>
    // Apply the saved theme before the first paint so dark mode doesn't flash.
    try {
      const theme = JSON.parse(localStorage.getItem('ccsarchive:settings') || '{}').theme;
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (err) { /* storage unavailable: fall back to the system theme */ }
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="navbar">
    <div class="navbar__inner">
      <a class="navbar__brand" href="#/">
        <img class="navbar__logo" src="assets/icons/logo.svg" alt="" width="32" height="32">
        <span>CCSArchive</span>
      </a>

      <nav class="navbar__links" aria-label="Main">
        <a class="navbar__link" href="#/" data-nav="/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
          <span>Decks</span>
        </a>
        <a class="navbar__link" href="#/stats" data-nav="/stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          <span>Stats</span>
        </a>
        <a class="navbar__link" href="#/settings" data-nav="/settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="navbar__stats">
        <span class="nav-stat nav-stat--streak" title="Day streak">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <span class="nav-stat__value" id="nav-streak">0</span>
          <span class="visually-hidden">day streak</span>
        </span>
        <span class="nav-stat nav-stat--xp" title="Level and XP">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span class="nav-stat__value" id="nav-level">Lv 1</span>
        </span>
      </div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
